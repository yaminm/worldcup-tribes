services:
  db:
    image: postgres:16-alpine
    container_name: tribes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tribes
      POSTGRES_PASSWORD: tribes
      POSTGRES_DB: tribes
    ports:
      - "5433:5432"
    volumes:
      - tribes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribes -d tribes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tribes_pgdata:
